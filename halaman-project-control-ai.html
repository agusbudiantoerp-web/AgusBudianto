/* =========================================================================
   SIMPLE SVG CHARTS (no chart library — self-contained line & bar charts)
   ========================================================================= */

function SCurveSvg({ data }) {
  if (!data.length) return null;
  const W = 640, H = 260, padL = 54, padR = 12, padT = 10, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const allVals = data.flatMap((d) => [d.PV, d.EV, d.AC]).filter((v) => v !== null && v !== undefined);
  const maxY = Math.max(1, ...allVals) * 1.12;
  const x = (i) => padL + (i / Math.max(1, data.length - 1)) * innerW;
  const y = (v) => padT + innerH - (v / maxY) * innerH;
  const seg = (key) => {
    const paths = []; let cur = [];
    data.forEach((d, i) => {
      const v = d[key];
      if (v === null || v === undefined) { if (cur.length > 1) paths.push(cur); cur = []; return; }
      cur.push(`${cur.length ? "L" : "M"}${x(i)},${y(v)}`);
    });
    if (cur.length > 1) paths.push(cur);
    return paths.map((p) => p.join(" "));
  };
  const gridLines = [0, 0.25, 0.5, 0.75, 1];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ overflow: "visible" }}>
      {gridLines.map((g, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={padT + innerH * (1 - g)} y2={padT + innerH * (1 - g)} stroke="#EEF1F2" />
          <text x={padL - 8} y={padT + innerH * (1 - g) + 4} fontSize="10" fill="#5B6B76" textAnchor="end" fontFamily="IBM Plex Mono, monospace">{fmtIDR(maxY * g)}</text>
        </g>
      ))}
      {data.map((d, i) => (i % 3 === 0 || i === data.length - 1) && (
        <text key={i} x={x(i)} y={H - 6} fontSize="10" fill="#5B6B76" textAnchor="middle">{d.label}</text>
      ))}
      {seg("PV").map((d, i) => <path key={"pv" + i} d={d} fill="none" stroke="#5B6B76" strokeWidth="2" strokeDasharray="4 3" />)}
      {seg("AC").map((d, i) => <path key={"ac" + i} d={d} fill="none" stroke="#C97A1E" strokeWidth="2.5" />)}
      {seg("EV").map((d, i) => <path key={"ev" + i} d={d} fill="none" stroke="#2F7DA6" strokeWidth="2.5" />)}
    </svg>
  );
}

function LegendRow({ items }) {

}

function GroupedBarSvg({ data }) {
  if (!data.length) return null;
  const W = 640, H = 220, padL = 54, padR = 12, padT = 10, padB = 34;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxY = Math.max(1, ...data.flatMap((d) => [d.Anggaran, d.Aktual])) * 1.15;
  const groupW = innerW / data.length;
  const barW = Math.min(28, groupW * 0.3);
  const y = (v) => padT + innerH - (v / maxY) * innerH;
  const gridLines = [0, 0.25, 0.5, 0.75, 1];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      {gridLines.map((g, i) => (
        <g key={i}>
          <line x1={padL} x2={W - padR} y1={padT + innerH * (1 - g)} y2={padT + innerH * (1 - g)} stroke="#EEF1F2" />
          <text x={padL - 8} y={padT + innerH * (1 - g) + 4} fontSize="10" fill="#5B6B76" textAnchor="end" fontFamily="IBM Plex Mono, monospace">{fmtIDR(maxY * g)}</text>
        </g>
      ))}
      {data.map((d, i) => {
        const cx = padL + groupW * i + groupW / 2;
        return (
          <g key={d.name}>
            <rect x={cx - barW - 2} y={y(d.Anggaran)} width={barW} height={innerH - (y(d.Anggaran) - padT)} fill="#5B6B76" rx="2" />
            <rect x={cx + 2} y={y(d.Aktual)} width={barW} height={innerH - (y(d.Aktual) - padT)} fill="#C97A1E" rx="2" />
            <text x={cx} y={H - 12} fontSize="10" fill="#5B6B76" textAnchor="middle">{d.name}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* =========================================================================
   HELPERS
   ========================================================================= */

const uid = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const DAY = 86400000;
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const iso = (d) => new Date(d).toISOString().slice(0, 10);
const today = new Date();

const fmtIDR = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n / 1e9).toFixed(2).replace(/\.00$/, "") + " M";
  if (abs >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + " Jt";
  return n.toLocaleString("id-ID");
};
const fmtFull = (n) => (n === null || n === undefined || isNaN(n) ? "—" : "Rp " + Math.round(n).toLocaleString("id-ID"));
const fmtPct = (n, d = 1) => (n === null || n === undefined || isNaN(n) ? "—" : n.toFixed(d) + "%");
const fmtIdx = (n) => (n === null || n === undefined || isNaN(n) ? "—" : n.toFixed(2));
const fmtDate = (d) => (d ? new Date(d).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }) : "—");

/* =========================================================================
   ENGINE FUNCTIONS
   ========================================================================= */

function plannedPercentAt(activity, asOf) {
  const s = new Date(activity.planned_start).getTime();
  const f = new Date(activity.planned_finish).getTime();
  const t = asOf.getTime();
  if (t <= s) return 0;
  if (t >= f) return 100;
  if (f === s) return 100;
  return ((t - s) / (f - s)) * 100;
}

function latestActualPercent(activityId, progress) {
  const rows = progress.filter((p) => p.activity_id === activityId);
  if (!rows.length) return 0;
  rows.sort((a, b) => new Date(b.date) - new Date(a.date));
  return rows[0].percent_complete;
}

function isOverdue(activity, actualPct, asOf) {
  return new Date(activity.planned_finish) < asOf && actualPct < 100;
}

function computeEngines(db, projectId, asOf) {
  const project = db.projects.find((p) => p.id === projectId);
  const wbsList = db.wbs.filter((w) => w.project_id === projectId);
  const activities = db.activities.filter((a) => a.project_id === projectId);
  const boq = db.boq.filter((b) => b.project_id === projectId);
  const budget = db.budget.filter((b) => b.project_id === projectId);
  const actualCost = db.actual_cost.filter((c) => c.project_id === projectId);
  const risks = db.risks.filter((r) => r.project_id === projectId);
  const progress = db.progress;

  // --- QUANTITY ENGINE ---
  const boqRows = boq.map((b) => {
    const planValue = b.qty_plan * b.unit_price;
    const actValue = b.qty_actual * b.unit_price;
    return {
      ...b,
      pct: b.qty_plan > 0 ? (b.qty_actual / b.qty_plan) * 100 : 0,
      planValue,
      actValue,
    };
  });
  const qtyPlanValue = boqRows.reduce((s, b) => s + b.planValue, 0);
  const qtyActValue = boqRows.reduce((s, b) => s + b.actValue, 0);
  const quantityProgressPct = qtyPlanValue > 0 ? (qtyActValue / qtyPlanValue) * 100 : 0;

  // --- SCHEDULE + PROGRESS ENGINE ---
  const actRows = activities.map((a) => {
    const actualPct = latestActualPercent(a.id, progress);
    const plannedPct = plannedPercentAt(a, asOf);
    return {
      ...a,
      actualPct,
      plannedPct,
      overdue: isOverdue(a, actualPct, asOf),
      varianceDays: Math.round(((actualPct - plannedPct) / 100) *
        ((new Date(a.planned_finish) - new Date(a.planned_start)) / DAY)),
    };
  });
  const totalWeight = actRows.reduce((s, a) => s + a.weight, 0) || 1;
  const plannedOverallPct = actRows.reduce((s, a) => s + a.weight * a.plannedPct, 0) / totalWeight;
  const actualOverallPct = actRows.reduce((s, a) => s + a.weight * a.actualPct, 0) / totalWeight;
  const overdueActivities = actRows.filter((a) => a.overdue);

  // --- COST ENGINE (per WBS) ---
  const wbsCost = wbsList.map((w) => {
    const bud = budget.filter((b) => b.wbs_id === w.id).reduce((s, b) => s + b.amount, 0);
    const act = actualCost.filter((c) => c.wbs_id === w.id).reduce((s, c) => s + c.amount, 0);
    return { ...w, budget: bud, actual: act, variance: bud - act, pctSpent: bud > 0 ? (act / bud) * 100 : 0 };
  });

  // --- EVM / KPI ENGINE ---
  const BAC = budget.reduce((s, b) => s + b.amount, 0) || project?.budget_total || 0;
  const AC = actualCost.reduce((s, c) => s + c.amount, 0);
  const PV = BAC * (plannedOverallPct / 100);
  const EV = BAC * (actualOverallPct / 100);
  const CPI = AC > 0 ? EV / AC : null;
  const SPI = PV > 0 ? EV / PV : null;
  const CV = EV - AC;
  const SV = EV - PV;

  // --- FORECAST ENGINE ---
  const EAC = CPI && CPI > 0 ? AC + (BAC - EV) / CPI : BAC;
  const ETC = EAC - AC;
  const VAC = BAC - EAC;
  let forecastFinish = null;
  if (activities.length) {
    const minStart = new Date(Math.min(...activities.map((a) => new Date(a.planned_start).getTime())));
    const maxFinish = new Date(Math.max(...activities.map((a) => new Date(a.planned_finish).getTime())));
    const originalDays = Math.max((maxFinish - minStart) / DAY, 1);
    const effectiveSPI = SPI && SPI > 0 ? SPI : 1;
    forecastFinish = addDays(minStart, originalDays / effectiveSPI);
  }

  // --- RISK ENGINE ---
  const riskRows = risks.map((r) => {
    const score = r.probability * r.impact;
    const level = score >= 15 ? "Tinggi" : score >= 8 ? "Sedang" : "Rendah";
    return { ...r, score, level };
  });
  const openRisks = riskRows.filter((r) => r.status !== "Selesai");
  const highRisks = openRisks.filter((r) => r.level === "Tinggi");
  const heatmap = {};
  for (let i = 1; i <= 5; i++) for (let j = 1; j <= 5; j++) heatmap[`${i}-${j}`] = 0;
  openRisks.forEach((r) => { heatmap[`${r.impact}-${r.probability}`] = (heatmap[`${r.impact}-${r.probability}`] || 0) + 1; });

  // --- EARLY WARNING SYSTEM ---
  const warnings = [];
  if (CPI !== null && CPI < 0.95) {
    warnings.push({
      id: "cost", severity: CPI < 0.85 ? "critical" : "warning",
      title: "Indikasi pembengkakan biaya",
      detail: `CPI saat ini ${fmtIdx(CPI)} — setiap Rp1.000 yang dibelanjakan hanya menghasilkan Rp${Math.round(CPI * 1000)} nilai pekerjaan.`,
    });
  }
  if (SPI !== null && SPI < 0.95) {
    warnings.push({
      id: "schedule", severity: SPI < 0.85 ? "critical" : "warning",
      title: "Indikasi keterlambatan jadwal",
      detail: `SPI saat ini ${fmtIdx(SPI)} — progres aktual tertinggal dari rencana sebesar ${fmtPct(100 - (SPI * 100))} secara nilai bobot.`,
    });
  }
  if (overdueActivities.length > 0) {
    warnings.push({
      id: "overdue", severity: "warning",
      title: `${overdueActivities.length} aktivitas melewati tanggal rencana selesai`,
      detail: overdueActivities.slice(0, 3).map((a) => a.name).join(", ") + (overdueActivities.length > 3 ? ", dll." : ""),
    });
  }
  if (highRisks.length > 0) {
    warnings.push({
      id: "risk", severity: "critical",
      title: `${highRisks.length} risiko berstatus TINGGI masih terbuka`,
      detail: highRisks.map((r) => r.description).slice(0, 2).join(" | "),
    });
  }
  const negativeVarianceWbs = wbsCost.filter((w) => w.variance < 0);
  if (negativeVarianceWbs.length > 0) {
    warnings.push({
      id: "wbs-cost", severity: "warning",
      title: `${negativeVarianceWbs.length} WBS melebihi anggarannya`,
      detail: negativeVarianceWbs.map((w) => w.name).join(", "),
    });
  }

  // --- DECISION SUPPORT (rule-based) ---
  const actions = [];
  if (warnings.some((w) => w.id === "cost")) actions.push("Lakukan cost review meeting mingguan dan bekukan pengeluaran non-esensial pada WBS yang boros.");
  if (warnings.some((w) => w.id === "schedule")) actions.push("Evaluasi jalur kritis, pertimbangkan penambahan shift kerja atau resource pada aktivitas yang tertinggal.");
  if (warnings.some((w) => w.id === "overdue")) actions.push("Terbitkan instruksi percepatan (acceleration notice) untuk aktivitas yang telah melewati tanggal rencana.");
  if (warnings.some((w) => w.id === "risk")) actions.push("Eskalasi risiko bernilai tinggi ke manajemen puncak dan aktifkan rencana mitigasi yang sudah disusun.");
  if (warnings.some((w) => w.id === "wbs-cost")) actions.push("Ajukan revisi anggaran atau variation order untuk WBS yang sudah melampaui pagu biaya.");
  if (actions.length === 0) actions.push("Kinerja proyek dalam batas toleransi — lanjutkan pemantauan rutin mingguan.");

  return {
    project, wbsList, activities: actRows, boq: boqRows, wbsCost, risks: riskRows, openRisks, highRisks, heatmap,
    quantityProgressPct, plannedOverallPct, actualOverallPct, overdueActivities,
    BAC, AC, PV, EV, CPI, SPI, CV, SV, EAC, ETC, VAC, forecastFinish, warnings, actions,
  };
}

function Panel({ title, meta, accent = "var(--blue-500)", children, actions }) {
  return (
    <section className="panel" style={{ "--accent": accent }}>
      <div className="panel-head">
        <h3>{title}</h3>
        <div className="panel-head-right">
          {meta && <span className="panel-meta">{meta}</span>}
          {actions}
        </div>
      </div>
      <div className="panel-body">{children}</div>
    </section>
  );
}

function Kpi({ label, value, sub, tone }) {
  return (
    <div className={`kpi ${tone || ""}`}>
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">{value}</div>
      {sub && <div className="kpi-sub">{sub}</div>}
    </div>
  );
}

function Bar1({ pct, tone }) {
  const clamped = Math.max(0, Math.min(100, pct || 0));
  return (
    <div className="bar1">
      <div className={`bar1-fill ${tone || ""}`} style={{ width: `${clamped}%` }} />
    </div>
  );
}

function StatusPill({ status }) {
  const map = {
    Approved: "good", Disetujui: "good", Aktif: "good", Selesai: "good",
    "Under Review": "warn", Menunggu: "warn", Terkirim: "warn", Dipantau: "warn",
    Terbuka: "bad", Rejected: "bad",
  };
  return <span className={`pill ${map[status] || "neutral"}`}>{status}</span>;
}

function IconBtn({ onClick, children, title }) {
  return <button className="icon-btn" onClick={onClick} title={title}>{children}</button>;
}

function App() {
  const [db, setDb] = useState(EMPTY_DB);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [projectId, setProjectId] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiText, setAiText] = useState("");
  const [aiError, setAiError] = useState("");
  const [apiKey, setApiKey] = useState(() => {
    try { return localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) { return ""; }
  });

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setDb(parsed);
        if (parsed.projects && parsed.projects.length) setProjectId(parsed.projects[0].id);
      }
    } catch (e) {
      // no saved data yet, or corrupted — start fresh
    } finally {
      setLoaded(true);
    }
  }, []);

  const persist = useCallback((next) => {
    setDb(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) { /* storage full or unavailable */ }
  }, []);

  const saveApiKey = (key) => {
    setApiKey(key);
    try { if (key) localStorage.setItem(API_KEY_STORAGE, key); else localStorage.removeItem(API_KEY_STORAGE); } catch (e) { /* ignore */ }
  };

  const loadSample = () => {
    const sample = buildSampleDb();
    persist(sample);
    setProjectId(sample.projects[0].id);
    setAiText(""); setAiError("");
  };

  const resetAll = () => {
    persist(EMPTY_DB);
    setProjectId(null);
    setAiText(""); setAiError("");
  };

  const addRow = (table, row) => {
    const next = { ...db, [table]: [...db[table], { id: uid(table), project_id: projectId, ...row }] };
    persist(next);
  };
  const removeRow = (table, id) => {
    persist({ ...db, [table]: db[table].filter((r) => r.id !== id) });
  };
  const addProgress = (activity_id, percent_complete) => {
    persist({ ...db, progress: [...db.progress, { id: uid("prog"), activity_id, date: iso(today), percent_complete: Number(percent_complete), note: "Update manual" }] });
  };

  const engines = useMemo(() => (projectId ? computeEngines(db, projectId, today) : null), [db, projectId]);

  const sCurveData = useMemo(() => {
    if (!engines || !engines.activities.length) return [];
    const starts = engines.activities.map((a) => new Date(a.planned_start).getTime());
    const finishes = engines.activities.map((a) => new Date(a.planned_finish).getTime());
    const minStart = new Date(Math.min(...starts));
    const maxFinish = new Date(Math.max(...finishes, engines.forecastFinish ? engines.forecastFinish.getTime() : 0));
    const totalWeight = engines.activities.reduce((s, a) => s + a.weight, 0) || 1;
    const points = [];
    const steps = 16;
    for (let i = 0; i <= steps; i++) {
      const t = new Date(minStart.getTime() + ((maxFinish - minStart) * i) / steps);
      const plannedPct = engines.activities.reduce((s, a) => s + a.weight * plannedPercentAt(a, t), 0) / totalWeight;
      const isPast = t <= today;
      const frac = Math.min(1, Math.max(0, (t - minStart) / Math.max(1, today - minStart)));
      points.push({
        label: t.toLocaleDateString("id-ID", { month: "short", yy: undefined, year: "2-digit" }),
        PV: Math.round(engines.BAC * (plannedPct / 100)),
        EV: isPast ? Math.round(engines.EV * frac) : null,
        AC: isPast ? Math.round(engines.AC * frac) : null,
      });
    }
    return points;
  }, [engines]);

  const wbsCostChart = useMemo(() => {
    if (!engines) return [];
    return engines.wbsCost.map((w) => ({ name: w.name.replace("Pekerjaan ", ""), Anggaran: Math.round(w.budget), Aktual: Math.round(w.actual) }));
  }, [engines]);

  const runAiAnalysis = async () => {
    if (!engines) return;
    if (!apiKey) { setAiError("Masukkan Anthropic API key Anda terlebih dahulu untuk mengaktifkan analisis AI."); return; }
    setAiLoading(true); setAiError(""); setAiText("");
    const payload = {
      proyek: engines.project?.name,
      progresRencana: fmtPct(engines.plannedOverallPct),
      progresAktual: fmtPct(engines.actualOverallPct),
      BAC: engines.BAC, EV: Math.round(engines.EV), AC: Math.round(engines.AC), PV: Math.round(engines.PV),
      CPI: engines.CPI, SPI: engines.SPI, EAC: Math.round(engines.EAC), VAC: Math.round(engines.VAC),
      perkiraanSelesai: engines.forecastFinish ? iso(engines.forecastFinish) : null,
      aktivitasTerlambat: engines.overdueActivities.map((a) => a.name),
      risikoTinggi: engines.highRisks.map((r) => ({ deskripsi: r.description, mitigasi: r.mitigation })),
      wbsMelebihiAnggaran: engines.wbsCost.filter((w) => w.variance < 0).map((w) => w.name),
      peringatanOtomatis: engines.warnings.map((w) => w.title),
    };
    const prompt = `Anda adalah konsultan senior project control untuk proyek konstruksi. Berikut adalah data kinerja proyek terkini dalam format JSON:\n\n${JSON.stringify(payload, null, 2)}\n\nBerikan analisis dalam Bahasa Indonesia dengan struktur berikut, ringkas dan tegas (maks. sekitar 300 kata):\n1. Ringkasan kondisi proyek (1-2 kalimat)\n2. Temuan utama (bullet, maksimal 4 poin, sebutkan angka pendukung)\n3. Rekomendasi tindakan prioritas (bullet, maksimal 4 poin, urutkan dari paling mendesak)\nJangan gunakan markdown heading (#), gunakan judul biasa diikuti titik dua.`;
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data?.error?.message || "Permintaan ditolak API.");
      const text = (data.content || []).map((c) => c.text || "").join("\n").trim();
      if (!text) throw new Error("Respons kosong dari model.");
      setAiText(text);
    } catch (e) {
      setAiError("Analisis AI gagal dimuat: " + (e.message || "periksa API key dan koneksi Anda."));
    } finally {
      setAiLoading(false);
    }
  };

    lines.push("");

    engines.warnings.forEach((w) => lines.push(`- [${w.severity.toUpperCase()}] ${w.title} — ${w.detail}`));
    lines.push("");
    lines.push(`REKOMENDASI TINDAKAN`);

    if (aiText) { lines.push(""); lines.push(`ANALISIS AI`); lines.push(aiText); }
    const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

  };

          <div className="brand-sub">Konstruksi & Rekayasa</div>
        </div>
        <nav className="nav">
          {NAV.map((n) => {
            const Icon = n.icon;
            return (
              <div key={n.id} className={`nav-item ${tab === n.id ? "active" : ""}`} onClick={() => setTab(n.id)}>
                <Icon size={16} /> <span>{n.label}</span>
              </div>
            );
          })}
        </nav>
        <div className="sidebar-foot">
          <button className="ghost-btn" onClick={loadSample}><RefreshCw size={13} /> Muat data contoh</button>
          <button className="ghost-btn" onClick={resetAll}><Eraser size={13} /> Kosongkan data</button>
        </div>
      </aside>

      <div className="main">
        <div className="topbar">
          <div>
            <h1>{NAV.find((n) => n.id === tab)?.label}</h1>
            <div className="topbar-sub">Per tanggal {fmtDate(today)}</div>
          </div>
          {db.projects.length > 0 && (
            <select className="proj-select" value={projectId || ""} onChange={(e) => setProjectId(e.target.value)}>
              {db.projects.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          )}
        </div>

        <div className="content">
          {!loaded ? (
            <div className="empty-state">Memuat data...</div>
          ) : db.projects.length === 0 ? (
            <div className="empty-state">
              <Building2 size={32} strokeWidth={1.3} />
              <h2>Belum ada proyek</h2>
              <p>Muat data contoh untuk melihat platform bekerja, atau mulai dengan menambah proyek di tab "Proyek & WBS".</p>
              <button className="primary-btn" onClick={loadSample}><Sparkles size={15} /> Muat data contoh</button>
            </div>
          ) : !engines ? (
            <div className="empty-state">Pilih proyek terlebih dahulu.</div>
          ) : (
            <>
              {tab === "dashboard" && <DashboardTab engines={engines} sCurveData={sCurveData} wbsCostChart={wbsCostChart} />}
              {tab === "project" && <ProjectTab db={db} engines={engines} projectId={projectId} addRow={addRow} removeRow={removeRow} setProjectId={setProjectId} persist={persist} />}
              {tab === "schedule" && <ScheduleTab db={db} engines={engines} addRow={addRow} removeRow={removeRow} addProgress={addProgress} />}
              {tab === "cost" && <CostTab db={db} engines={engines} addRow={addRow} removeRow={removeRow} />}
              {tab === "risk" && <RiskTab engines={engines} addRow={addRow} removeRow={removeRow} />}
              {tab === "docs" && <DocsTab db={db} addRow={addRow} removeRow={removeRow} />}
              {tab === "ai" && <AiTab engines={engines} aiLoading={aiLoading} aiText={aiText} aiError={aiError} runAiAnalysis={runAiAnalysis} downloadReport={downloadReport} apiKey={apiKey} saveApiKey={saveApiKey} />}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   TAB: DASHBOARD
   ========================================================================= */

function DashboardTab({ engines, sCurveData, wbsCostChart }) {
  const cpiTone = engines.CPI == null ? "" : engines.CPI >= 1 ? "good" : engines.CPI >= 0.9 ? "warn" : "bad";
  const spiTone = engines.SPI == null ? "" : engines.SPI >= 1 ? "good" : engines.SPI >= 0.9 ? "warn" : "bad";
  return (
    <>
      <div className="grid-kpi">
        <Kpi label="Progres Aktual vs Rencana" value={fmtPct(engines.actualOverallPct)} sub={`Rencana: ${fmtPct(engines.plannedOverallPct)}`} tone={engines.actualOverallPct >= engines.plannedOverallPct ? "good" : "warn"} />
        <Kpi label="Cost Performance Index (CPI)" value={fmtIdx(engines.CPI)} sub={engines.CPI >= 1 ? "Efisien" : "Boros anggaran"} tone={cpiTone} />
        <Kpi label="Schedule Performance Index (SPI)" value={fmtIdx(engines.SPI)} sub={engines.SPI >= 1 ? "Sesuai/lebih cepat" : "Tertinggal jadwal"} tone={spiTone} />
        <Kpi label="Estimasi Biaya Akhir (EAC)" value={fmtIDR(engines.EAC)} sub={`VAC: ${engines.VAC >= 0 ? "+" : ""}${fmtIDR(engines.VAC)}`} tone={engines.VAC >= 0 ? "good" : "bad"} />
      </div>

      <div className="grid-2">
        <Panel title="Kurva-S: Nilai Rencana, Perolehan & Biaya Aktual" accent="var(--blue-500)" meta="PV · EV · AC">
          <SCurveSvg data={sCurveData} />
          <LegendRow items={[
            { label: "Rencana (PV)", color: "#5B6B76", dash: true },
            { label: "Perolehan (EV)", color: "#2F7DA6" },
            { label: "Biaya Aktual (AC)", color: "#C97A1E" },
          ]} />
        </Panel>

        <Panel title="Peringatan Dini" accent="var(--red)" meta={`${engines.warnings.length} peringatan aktif`}>
          {engines.warnings.length === 0 ? (
            <div style={{ color: "var(--green)", display: "flex", alignItems: "center", gap: 8 }}><CheckCircle2 size={16} /> Tidak ada peringatan — kinerja proyek dalam batas normal.</div>
          ) : engines.warnings.map((w) => (
            <div key={w.id} className={`warn-card ${w.severity}`}>
              <AlertTriangle size={16} />
              <div><div className="warn-title">{w.title}</div><div className="warn-detail">{w.detail}</div></div>
            </div>
          ))}
        </Panel>
      </div>

      <div className="grid-2">
        <Panel title="Anggaran vs Biaya Aktual per WBS" accent="var(--amber)">
          <GroupedBarSvg data={wbsCostChart} />
          <LegendRow items={[
            { label: "Anggaran", color: "#5B6B76" },
            { label: "Biaya Aktual", color: "#C97A1E" },
          ]} />
        </Panel>

        <Panel title="Progres per WBS" accent="var(--green)">
          <table>
            <thead><tr><th>WBS</th><th className="num">Progres</th></tr></thead>
            <tbody>
              {engines.wbsList.map((w) => {
                const acts = engines.activities.filter((a) => a.wbs_id === w.id);
                const tw = acts.reduce((s, a) => s + a.weight, 0) || 1;
                const pct = acts.reduce((s, a) => s + a.weight * a.actualPct, 0) / tw;
                return (
                  <tr key={w.id}>
                    <td className="row-name">{w.name}</td>
                    <td className="num">
                      <div style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "flex-end" }}>
                        <div style={{ width: 80 }}><Bar1 pct={pct} tone={pct >= 60 ? "good" : pct >= 25 ? "warn" : ""} /></div>
                        {fmtPct(pct)}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Panel>
      </div>
    </>
  );
}

/* =========================================================================
   TAB: PROJECT & WBS
   ========================================================================= */

function ProjectTab({ db, projectId, addRow, removeRow, setProjectId, persist }) {
  const [form, setForm] = useState({ name: "", owner: "", start_date: iso(today), end_date: iso(addDays(today, 180)), budget_total: "" });
  const [wbsForm, setWbsForm] = useState({ code: "", name: "" });

  const createProject = () => {
    if (!form.name) return;
    const np = { id: uid("proj"), project_id: undefined, ...form, budget_total: Number(form.budget_total) || 0, currency: "IDR", status: "Berjalan" };
    delete np.project_id;
    const next = { ...db, projects: [...db.projects, np] };
    persist(next);
    setProjectId(np.id);
    setForm({ name: "", owner: "", start_date: iso(today), end_date: iso(addDays(today, 180)), budget_total: "" });
  };

  const project = db.projects.find((p) => p.id === projectId);
  const wbsList = db.wbs.filter((w) => w.project_id === projectId);

  return (
    <>
      <Panel title="Daftar Proyek" accent="var(--blue-500)" meta={`${db.projects.length} proyek`}>
        <table>
          <thead><tr><th>Nama Proyek</th><th>Pemilik/Kontraktor</th><th>Mulai</th><th>Selesai</th><th className="num">Anggaran</th><th></th></tr></thead>
          <tbody>
            {db.projects.map((p) => (
              <tr key={p.id}>
                <td className="row-name">{p.name}</td>
                <td>{p.owner}</td>
                <td>{fmtDate(p.start_date)}</td>
                <td>{fmtDate(p.end_date)}</td>
                <td className="num">{fmtFull(p.budget_total)}</td>
                <td><IconBtn onClick={() => { removeRow("projects", p.id); if (projectId === p.id) setProjectId(null); }}><Trash2 size={14} /></IconBtn></td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="inline-form">
          <div className="field"><label>Nama proyek</label><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Cth: Jalan Tol Seksi 2" /></div>
          <div className="field"><label>Pemilik/Kontraktor</label><input value={form.owner} onChange={(e) => setForm({ ...form, owner: e.target.value })} /></div>
          <div className="field"><label>Mulai</label><input type="date" value={form.start_date} onChange={(e) => setForm({ ...form, start_date: e.target.value })} /></div>
          <div className="field"><label>Selesai</label><input type="date" value={form.end_date} onChange={(e) => setForm({ ...form, end_date: e.target.value })} /></div>
          <div className="field"><label>Anggaran total (Rp)</label><input type="number" value={form.budget_total} onChange={(e) => setForm({ ...form, budget_total: e.target.value })} /></div>
          <button className="add-btn" onClick={createProject}><Plus size={14} /> Tambah proyek</button>
        </div>
      </Panel>

      {project && (
        <Panel title={`Struktur WBS — ${project.name}`} accent="var(--amber)" meta={`${wbsList.length} elemen`}>
          <table>
            <thead><tr><th>Kode</th><th>Nama WBS</th><th></th></tr></thead>
            <tbody>
              {wbsList.map((w) => (
                <tr key={w.id}><td className="mono">{w.code}</td><td>{w.name}</td>
                  <td><IconBtn onClick={() => removeRow("wbs", w.id)}><Trash2 size={14} /></IconBtn></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="inline-form">
            <div className="field"><label>Kode</label><input value={wbsForm.code} onChange={(e) => setWbsForm({ ...wbsForm, code: e.target.value })} style={{ minWidth: 60 }} /></div>
            <div className="field"><label>Nama WBS</label><input value={wbsForm.name} onChange={(e) => setWbsForm({ ...wbsForm, name: e.target.value })} placeholder="Cth: Pekerjaan Struktur" /></div>
            <button className="add-btn" onClick={() => { if (wbsForm.name) { addRow("wbs", { ...wbsForm, parent_id: null }); setWbsForm({ code: "", name: "" }); } }}><Plus size={14} /> Tambah WBS</button>
          </div>
        </Panel>
      )}
    </>
  );
}

/* =========================================================================

function ScheduleTab({ db, engines, addRow, removeRow, addProgress }) {
  const [form, setForm] = useState({ wbs_id: "", name: "", weight: "", planned_start: iso(today), planned_finish: iso(addDays(today, 30)) });
  const [boqForm, setBoqForm] = useState({ wbs_id: "", item: "", unit: "", qty_plan: "", unit_price: "", qty_actual: "" });

    <>
      <Panel title="Aktivitas & Jadwal" accent="var(--blue-500)" meta={`${engines.activities.length} aktivitas`}>
        <table>
          <thead><tr><th>Aktivitas</th><th>WBS</th><th>Rencana</th><th className="num">Bobot</th><th className="num">Progres</th><th></th></tr></thead>
          <tbody>
            {engines.activities.map((a) => {
              const w = engines.wbsList.find((x) => x.id === a.wbs_id);

                <tr key={a.id}>
                  <td className="row-name">{a.name}{a.overdue && <span style={{ marginLeft: 6 }}><StatusPill status="Terbuka" /></span>}

                      <input type="number" min="0" max="100" defaultValue={a.actualPct} style={{ width: 52, padding: "4px 6px", border: "1px solid var(--line)", borderRadius: 3 }}
                        onBlur={(e) => { const v = Number(e.target.value); if (!isNaN(v) && v !== a.actualPct) addProgress(a.id, v); }} />%
                    </div>
                  </td>
                  <td><IconBtn onClick={() => removeRow("activities", a.id)}><Trash2 size={14} /></IconBtn></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="inline-form">
          <div className="field"><label>WBS</label>
            <select value={form.wbs_id} onChange={(e) => setForm({ ...form, wbs_id: e.target.value })}>
              <option value="">Pilih WBS</option>
              {engines.wbsList.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
            </select>
          </div>
          <div className="field"><label>Nama aktivitas</label><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></div>
          <div className="field"><label>Bobot (%)</label><input type="number" value={form.weight} onChange={(e) => setForm({ ...form, weight: e.target.value })} style={{ width: 70 }} /></div>
          <div className="field"><label>Mulai</label><input type="date" value={form.planned_start} onChange={(e) => setForm({ ...form, planned_start: e.target.value })} /></div>
          <div className="field"><label>Selesai</label><input type="date" value={form.planned_finish} onChange={(e) => setForm({ ...form, planned_finish: e.target.value })} /></div>
          <button className="add-btn" onClick={() => {
            if (form.name && form.wbs_id) { addRow("activities", { ...form, weight: Number(form.weight) || 0, predecessor: "" }); setForm({ wbs_id: "", name: "", weight: "", planned_start: iso(today), planned_finish: iso(addDays(today, 30)) }); }
          }}><Plus size={14} /> Tambah aktivitas</button>
        </div>
      </Panel>

      <Panel title="Bill of Quantity (BOQ)" accent="var(--amber)" meta={`${engines.boq.length} item`}>
        <table>
          <thead><tr><th>Item</th><th>WBS</th><th className="num">Qty Rencana</th><th className="num">Qty Aktual</th><th className="num">Harga Satuan</th><th className="num">Progres Qty</th><th></th></tr></thead>
          <tbody>
            {engines.boq.map((b) => {
              const w = engines.wbsList.find((x) => x.id === b.wbs_id);
              return (
                <tr key={b.id}>
                  <td className="row-name">{b.item}</td>
                  <td>{w?.name}</td>
                  <td className="num">{b.qty_plan.toLocaleString("id-ID")} {b.unit}</td>
                  <td className="num">{b.qty_actual.toLocaleString("id-ID")} {b.unit}</td>
                  <td className="num">{fmtFull(b.unit_price)}</td>
                  <td className="num">{fmtPct(b.pct, 0)}</td>
                  <td><IconBtn onClick={() => removeRow("boq", b.id)}><Trash2 size={14} /></IconBtn></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="inline-form">
          <div className="field"><label>WBS</label>
            <select value={boqForm.wbs_id} onChange={(e) => setBoqForm({ ...boqForm, wbs_id: e.target.value })}>
              <option value="">Pilih WBS</option>
              {engines.wbsList.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
            </select>
          </div>
          <div className="field"><label>Nama item</label><input value={boqForm.item} onChange={(e) => setBoqForm({ ...boqForm, item: e.target.value })} /></div>
          <div className="field"><label>Satuan</label><input value={boqForm.unit} onChange={(e) => setBoqForm({ ...boqForm, unit: e.target.value })} style={{ width: 60 }} /></div>
          <div className="field"><label>Qty rencana</label><input type="number" value={boqForm.qty_plan} onChange={(e) => setBoqForm({ ...boqForm, qty_plan: e.target.value })} style={{ width: 90 }} /></div>
          <div className="field"><label>Qty aktual</label><input type="number" value={boqForm.qty_actual} onChange={(e) => setBoqForm({ ...boqForm, qty_actual: e.target.value })} style={{ width: 90 }} /></div>
          <div className="field"><label>Harga satuan</label><input type="number" value={boqForm.unit_price} onChange={(e) => setBoqForm({ ...boqForm, unit_price: e.target.value })} style={{ width: 110 }} /></div>
          <button className="add-btn" onClick={() => {
            if (boqForm.item && boqForm.wbs_id) { addRow("boq", { ...boqForm, qty_plan: Number(boqForm.qty_plan) || 0, qty_actual: Number(boqForm.qty_actual) || 0, unit_price: Number(boqForm.unit_price) || 0 }); setBoqForm({ wbs_id: "", item: "", unit: "", qty_plan: "", unit_price: "", qty_actual: "" }); }
          }}><Plus size={14} /> Tambah item</button>
        </div>
      </Panel>
    </>
  );
}

/* =========================================================================
   TAB: RISK
   ========================================================================= */

const RISK_COLORS = { Rendah: "#2E7D50", Sedang: "#C97A1E", Tinggi: "#B33B27" };

function RiskTab({ engines, addRow, removeRow }) {
  const [form, setForm] = useState({ description: "", category: "", probability: 3, impact: 3, status: "Terbuka", mitigation: "", owner: "" });

  return (
    <>
      <div className="grid-2">
        <Panel title="Daftar Risiko" accent="var(--red)" meta={`${engines.risks.length} risiko`}>
          <table>
            <thead><tr><th>Deskripsi</th><th>Kategori</th><th className="num">Skor</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {engines.risks.map((r) => (
                <tr key={r.id}>
                  <td className="row-name">{r.description}<div className="row-sub">Mitigasi: {r.mitigation}</div></td>
                  <td>{r.category}</td>
                  <td className="num"><span className="pill" style={{ background: RISK_COLORS[r.level] + "22", color: RISK_COLORS[r.level] }}>{r.score} · {r.level}</span></td>

          </table>
          <div className="inline-form">
            <div className="field"><label>Deskripsi risiko</label><input value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} style={{ minWidth: 220 }} /></div>
            <div className="field"><label>Kategori</label><input value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} style={{ width: 110 }} /></div>
            <div className="field"><label>Probabilitas (1-5)</label><input type="number" min="1" max="5" value={form.probability} onChange={(e) => setForm({ ...form, probability: Number(e.target.value) })} style={{ width: 60 }} /></div>
            <div className="field"><label>Dampak (1-5)</label><input type="number" min="1" max="5" value={form.impact} onChange={(e) => setForm({ ...form, impact: Number(e.target.value) })} style={{ width: 60 }} /></div>
            <div className="field"><label>Status</label>
              <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
                <option>Terbuka</option><option>Dipantau</option><option>Selesai</option>
              </select>
            </div>
            <div className="field"><label>Mitigasi</label><input value={form.mitigation} onChange={(e) => setForm({ ...form, mitigation: e.target.value })} style={{ minWidth: 160 }} /></div>
            <div className="field"><label>PIC</label><input value={form.owner} onChange={(e) => setForm({ ...form, owner: e.target.value })} style={{ width: 110 }} /></div>
            <button className="add-btn" onClick={() => { if (form.description) { addRow("risks", form); setForm({ description: "", category: "", probability: 3, impact: 3, status: "Terbuka", mitigation: "", owner: "" }); } }}><Plus size={14} /> Tambah risiko</button>
          </div>
        </Panel>

        <Panel title="Peta Risiko" accent="var(--amber)" meta="Dampak × Probabilitas">
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ display: "flex", flexDirection: "column-reverse", gap: 3, justifyContent: "flex-end" }}>
              {[1, 2, 3, 4, 5].map((impact) => (
                <div key={impact} className="heatmap" style={{ gridTemplateColumns: "repeat(5, 32px)" }}>
                  {[1, 2, 3, 4, 5].map((prob) => {
                    const score = impact * prob;
                    const count = engines.heatmap[`${impact}-${prob}`] || 0;
                    const color = score >= 15 ? RISK_COLORS.Tinggi : score >= 8 ? RISK_COLORS.Sedang : RISK_COLORS.Rendah;
                    return <div key={prob} className="heat-cell" style={{ background: color, opacity: count > 0 ? 1 : 0.35 }}>{count > 0 ? count : ""}</div>;
                  })}
                </div>
              ))}
            </div>
          </div>
          <div style={{ fontSize: 11, color: "var(--ink-soft)", marginTop: 10 }}>Baris = dampak (1 bawah → 5 atas) · Kolom = probabilitas (1 kiri → 5 kanan). Angka menunjukkan jumlah risiko terbuka pada sel tersebut.</div>
          <div style={{ marginTop: 16, display: "flex", gap: 14, fontSize: 11.5 }}>
            <span style={{ color: RISK_COLORS.Rendah }}>■ Rendah</span>
            <span style={{ color: RISK_COLORS.Sedang }}>■ Sedang</span>
            <span style={{ color: RISK_COLORS.Tinggi }}>■ Tinggi</span>
          </div>
        </Panel>
      </div>
    </>
  );
}

            <div className="field"><label>Revisi</label><input value={dwgForm.revision} onChange={(e) => setDwgForm({ ...dwgForm, revision: e.target.value })} style={{ width: 70 }} /></div>

        </Panel>

        <Panel title="Dokumen Proyek" accent="var(--amber)" meta={`${documents.length} dokumen`}>

          </table>
          <div className="inline-form">
            <div className="field"><label>Judul</label><input value={docForm.title} onChange={(e) => setDocForm({ ...docForm, title: e.target.value })} /></div>
            <div className="field"><label>Jenis</label><input value={docForm.type} onChange={(e) => setDocForm({ ...docForm, type: e.target.value })} style={{ width: 100 }} /></div>
            <div className="field"><label>Status</label><input value={docForm.status} onChange={(e) => setDocForm({ ...docForm, status: e.target.value })} style={{ width: 100 }} /></div>
            <button className="add-btn" onClick={() => { if (docForm.title) { addRow("documents", docForm); setDocForm({ title: "", type: "", status: "Aktif" }); } }}><Plus size={14} /> Tambah</button>

      <Panel title="Persetujuan (Approvals)" accent="var(--green)" meta={`${approvals.length} pengajuan`}>

              <tr key={a.id}><td>{a.ref_type}</td><td className="row-name">{a.ref_title}</td><td>{a.approver}</td><td>{fmtDate(a.date)}</td><td><StatusPill status={a.status} /></td>
                <td><IconBtn onClick={() => removeRow("approvals", a.id)}><Trash2 size={14} /></IconBtn></td></tr>

          </tbody>
        </table>
        <div className="inline-form">
          <div className="field"><label>Jenis</label><input value={aprForm.ref_type} onChange={(e) => setAprForm({ ...aprForm, ref_type: e.target.value })} style={{ width: 110 }} /></div>
