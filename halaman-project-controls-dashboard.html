<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Project Controls Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#050d1a;--card:#0a1b33;--line:#17355c;--gold:#e8b84a;--tx:#e8eef8;--mut:#8fa5c4;--g:#2ecc71;--o:#f39c12;--r:#e74c3c;--b:#3b9ef5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Segoe UI,Arial,sans-serif;font-size:13px}
.wrap{max-width:1500px;margin:auto;padding:10px}
header{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#08182e,#0d2a4d);border:1px solid var(--line);border-radius:8px;padding:10px 16px;flex-wrap:wrap}
.p6{background:#d32f2f;font-weight:800;font-size:22px;padding:8px 10px;border-radius:6px}
header h1{flex:1;text-align:center;margin:0;font-family:Georgia,serif;color:var(--gold);font-size:26px;letter-spacing:1px;min-width:260px}
header small{color:var(--mut);display:block;text-align:center;font-family:Arial;font-size:11px;letter-spacing:3px}
.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{background:#12365f;color:var(--tx);border:1px solid var(--line);padding:7px 11px;border-radius:6px;cursor:pointer}
.tools button:hover{background:#1a4a82}
.meta{display:flex;gap:26px;padding:8px 14px;color:var(--mut);flex-wrap:wrap}.meta b{display:block;color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .l{color:var(--mut);font-size:11px}.kpi .v{font-size:26px;font-weight:700;margin:4px 0}.kpi .s{font-size:11px}
.up{color:var(--g)}.dn{color:var(--r)}.bar{height:5px;background:#173459;border-radius:3px;margin-top:5px}.bar i{display:block;height:100%;background:var(--g);border-radius:3px}
.row{display:grid;gap:8px;margin-bottom:8px}.r2{grid-template-columns:2fr 1fr}.r4{grid-template-columns:repeat(4,1fr)}.r3{grid-template-columns:1.2fr 1.1fr 1.2fr}
h3{margin:0 0 8px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:6px}
.evm{display:grid;grid-template-columns:1fr 110px;gap:8px}.evm .nums div{background:#0d2442;border:1px solid var(--line);padding:6px;margin-bottom:6px;text-align:right}.nums span{display:block;color:var(--mut);font-size:11px;text-align:left}.nums b{font-size:17px}
.health{display:flex;gap:14px;align-items:center}.hl{flex:1}.hl div{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #12294a}
.note{margin-top:8px;border:1px solid #7a6320;background:#2a240c;padding:8px;font-style:italic;color:#e9d9a6;border-radius:4px}
.disc{display:flex;gap:10px;align-items:center}.disc .bars{flex:1}.bars div{display:grid;grid-template-columns:52px 1fr 36px;gap:6px;align-items:center;margin:5px 0;font-size:11px}
.trk{height:9px;background:#173459;border-radius:2px}.trk i{display:block;height:100%;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--mut);text-align:left;padding:5px;border-bottom:1px solid var(--line)}td{padding:5px;border-bottom:1px solid #102846}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.sc{display:inline-block;min-width:26px;text-align:center;padding:2px 4px;border-radius:3px;color:#111;font-weight:700}
.mx{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:250px}.mx div{height:42px;position:relative}.mx i{position:absolute;inset:0;margin:auto;width:24px;height:24px;border-radius:50%;background:#000a;border:2px solid #fff;color:#fff;font:700 12px/20px Arial;text-align:center;font-style:normal}
footer{text-align:center;color:var(--mut);font-style:italic;padding:10px;font-family:Georgia,serif}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.r2,.r3,.r4{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.kpis,.r2,.r3,.r4{grid-template-columns:1fr}.evm{grid-template-columns:1fr}}
@media print{.tools{display:none}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div class="wrap">

let D=null;const $=id=>document.getElementById(id);
const COL={'Completed':'#2ecc71','On Track':'#2ecc71','At Risk':'#f39c12','Monitor':'#f1c40f','Delayed':'#e74c3c'};
const dot=s=>`<span class="dot" style="background:${COL[s]||'#888'}"></span>`;
const cfg=()=>Object.fromEntries(D.Config.map(r=>[r.Key,r.Value]));
const f1=n=>Number(n).toLocaleString('en-US');
function donut(p,col,sz=110,lab){const r=sz/2-9,c=2*Math.PI*r;return `<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#173459" stroke-width="12"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})" stroke-linecap="round"/><text x="50%" y="50%" fill="#fff" font-size="${sz/4.5}" font-weight="700" text-anchor="middle" dy=".1em">${Math.round(p)}%</text>${lab?`<text x="50%" y="62%" fill="#8fa5c4" font-size="10" text-anchor="middle" dy="1em">${lab}</text>`:''}</svg>`}
function render(){
 const C=cfg(),S=D.SCurve,n=S.filter(r=>r.EV!=null&&r.EV!=='').length,L=S[n-1];
 const PV=L['PV (USD M)'],EV=L['EV (USD M)'],AC=L['AC (USD M)'];
 const spi=+(EV/PV).toFixed(2),cpi=+(EV/AC).toFixed(2),cv=EV-AC,sv=C.sv_days;
 $('title').textContent=C.project_name;document.title=C.project_name;
 $('meta').innerHTML=[['Project Code',C.project_code],['Client',C.client],['Contractor',C.contractor],['Reporting Period',C.period],['Lokasi',C.location]].map(a=>`<div>${a[0]}<b>${a[1]}</b></div>`).join('');
 const k=(l,v,s,cl='')=>`<div class="card kpi"><div class="l">${l}</div><div class="v ${cl}">${v}</div><div class="s ${cl}">${s}</div></div>`;
 const d=(a,b)=>{const x=+(a-b).toFixed(2);return `${x>=0?'▲ +':'▼ '}${x}`};
 $('kpis').innerHTML=`<div class="card kpi"><div class="l">Overall Progress</div><div class="v">${C.overall_progress}%</div><div class="s up">▲ +${C.progress_change}%</div><div class="bar"><i style="width:${C.overall_progress}%"></i></div></div>`+
 k('SPI',spi.toFixed(2),d(spi,C.spi_prev),spi>=1?'up':'dn')+k('CPI',cpi.toFixed(2),d(cpi,C.cpi_prev),cpi>=1?'up':'dn')+
 k('Cost Variance (CV)',`${cv>=0?'+':'-'}$${Math.abs(cv)} M`,cv>=0?'Favourable':'Unfavourable',cv>=0?'up':'dn')+
 k('Schedule Variance (SV)',`${sv>=0?'+':'-'} ${Math.abs(sv)} Days`,sv>=0?'Ahead of Schedule':'Behind Schedule',sv>=0?'up':'dn')+
 k('Forecast Completion',C.fcst_finish,`(Orig: ${C.orig_finish})`)+
 k('Open Risks',C.open_risks,`(${D.Risiko.filter(r=>r['Probabilitas (1-5)']*r['Dampak (1-5)']>=15).length} High)`)+
 k('Total Manpower',f1(C.manpower),`▲ +${C.manpower_change}%`,'up');
 // S-curve
 const W=760,H=300,m={l:46,r:8,t:12,b:40},mx=Math.ceil(Math.max(C.bac,...S.map(r=>r['PV (USD M)']))/500)*500;
 const X=i=>m.l+i*(W-m.l-m.r)/(S.length-1),Y=v=>H-m.b-v*(H-m.t-m.b)/mx;
 const line=(key,col,cnt)=>`<polyline fill="none" stroke="${col}" stroke-width="2" points="${S.slice(0,cnt).map((r,i)=>X(i)+','+Y(r[key])).join(' ')}"/>`;
 let g='';for(let v=0;v<=mx;v+=500)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#17355c"/><text x="${m.l-6}" y="${Y(v)+4}" fill="#8fa5c4" font-size="10" text-anchor="end">${f1(v)}</text>`;
 S.forEach((r,i)=>{if(i%2==0)g+=`<text x="${X(i)}" y="${H-m.b+14}" fill="#8fa5c4" font-size="9" text-anchor="middle" transform="rotate(-35 ${X(i)} ${H-m.b+14})">${r.Bulan}</text>`});
 $('sc').innerHTML=g+`<line x1="${X(n-1)}" x2="${X(n-1)}" y1="${m.t}" y2="${H-m.b}" stroke="#8fa5c4" stroke-dasharray="4"/><text x="${X(n-1)-4}" y="${m.t+10}" fill="#8fa5c4" font-size="10" text-anchor="end">Data Date ${C.data_date}</text>`+

 // milestones
 $('ms').innerHTML='<tr><th>Milestone</th><th>Planned</th><th>Forecast</th><th>Status</th></tr>'+D.Milestone.map(r=>`<tr><td>${r.Milestone}</td><td>${r['Planned Date']}</td><td>${r['Forecast Date']}</td><td>${dot(r.Status)}${r.Status}</td></tr>`).join('');
 // risk
 const sc=s=>s>=15?'#e74c3c':s>=10?'#f39c12':s>=5?'#f1c40f':'#2ecc71';let cells='';
 for(let im=5;im>=1;im--)for(let p=1;p<=5;p++){const dots=D.Risiko.filter(r=>r['Probabilitas (1-5)']==p&&r['Dampak (1-5)']==im).map(r=>`<i>${r.No}</i>`).join('');cells+=`<div style="background:${sc(p*im)}">${dots}</div>`}
 $('mx').innerHTML=cells;
 $('rk').innerHTML='<tr><th>#</th><th>Risk</th><th>Skor</th></tr>'+D.Risiko.map(r=>{const s=r['Probabilitas (1-5)']*r['Dampak (1-5)'];return `<tr><td>${r.No}</td><td>${r['Risk Description']}</td><td><span class="sc" style="background:${sc(s)}">${s}</span></td></tr>`}).join('');
 // procurement
 const M=D.Material,tot=M.reduce((a,r)=>a+r.Jumlah,0),del=M[0].Jumlah,cl=['#2ecc71','#3b9ef5','#f39c12'];
 $('md').innerHTML=donut(del/tot*100,'#2ecc71',120,'Total Progress');
 $('ml').innerHTML=M.map((r,i)=>`<div><span><span class="dot" style="background:${cl[i]}"></span>${r.Status}</span><span>${f1(r.Jumlah)} (${Math.round(r.Jumlah/tot*100)}%)</span></div>`).join('');
 $('cr').innerHTML='<tr><th>Critical Delivery</th><th>Required</th><th>Status</th></tr>'+D.Kritis.map(r=>`<tr><td>${r.Item}</td><td>${r['Required Date']}</td><td>${dot(r.Status)}${r.Status}</td></tr>`).join('');
 $('vd').innerHTML='<div style="color:var(--mut);font-size:11px">Vendor Performance (On-Time Delivery)</div>'+D.Vendor.map(r=>{const v=r['On-Time Delivery %'];return `<div style="display:grid;grid-template-columns:60px 1fr 36px;gap:6px;align-items:center;margin:3px 0"><span>${r.Vendor}</span><span class="trk"><i style="width:${v}%;background:${v>=85?'#2ecc71':v>=75?'#f1c40f':'#f39c12'}"></i></span>${v}%</div>`}).join('');
 $('foot').innerHTML=`Delivering Today for a Sustainable Tomorrow<br><small style="font-style:normal;font-family:Arial">Report Date: ${C.report_date} | Prepared by: ${C.prepared_by}</small>`;
}
function load(wb){const o={};['Config','SCurve','Disiplin','Health','Milestone','Risiko','Material','Kritis','Vendor'].forEach(s=>{if(!wb.Sheets[s])throw new Error('Sheet "'+s+'" tidak ditemukan');o[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null})});D=o;try{localStorage.setItem('pcd',JSON.stringify(o))}catch(e){}render()}
fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{load(XLSX.read(x.target.result,{type:'array'}))}catch(err){alert('Gagal membaca Excel: '+err.message)}};r.readAsArrayBuffer(f);fi.value=''};
function exportX(){const wb=XLSX.utils.book_new();for(const k in D)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D[k]),k);XLSX.writeFile(wb,'ProjectControls_Backup_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function resetD(){try{localStorage.removeItem('pcd')}catch(e){}D=JSON.parse(JSON.stringify(DEFAULT));render()}
try{D=JSON.parse(localStorage.getItem('pcd'))}catch(e){}
if(!D)D=JSON.parse(JSON.stringify(DEFAULT));render();
if(location.protocol.startsWith('http'))fetch('ProjectControls_Database.xlsx').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>load(XLSX.read(b,{type:'array'}))).catch(()=>{});
